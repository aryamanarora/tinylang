evaluators:
- class: SummaryEvaluator
  config:
    run_every_n_steps: 200
# - class: InterchangeEvaluator
#   config:
#     run_every_n_steps: 1000
- class: LCAEvaluator
  config:
    run_every_n_steps: 200
    interpolation_steps: 100
language:
  class: AR
  file: /nlp/scr/aryaman/tinylang/languages/ar_32.pkl
model:
  class: Zoology
  config:
    bias: false
    mixer_type: mamba
    n_embd: 32
    n_head: 1
    n_layer: 2
    n_positions: 1024
    pos_emb: false
    state_mixer_type: mlp
training:
  cosine: true
  eval_batch_size: 2
  lr: 0.001
  num_eval_steps: 1
  num_train_epochs: 8
  num_train_steps: 3126
  train_batch_size: 32
  warmup_percentage: 0.2
  weight_decay: 0.0
