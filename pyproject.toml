[project]
name = "tinylang"
version = "0.1.0"
description = "A framework for mechanistic evaluations of language model architectures on synthetic tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "editables>=0.5",
    "flash-linear-attention>=0.3.0",
    "hatchling>=1.27.0",
    "imageio>=2.37.0",
    "ipykernel>=6.29.5",
    "matplotlib",
    "matplotlib-label-lines",
    "nbstripout>=0.7.1",
    "notebook>=7.3.2",
    "numpy",
    "opt-einsum>=3.4.0",
    "plotnine",
    "pre-commit>=4.0.0",
    "pyarrow>=19.0.1",
    "pytest>=8.3.5",
    "pyvene",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "termcolor>=2.5.0",
    "torch>=2.5.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.2",
    "umap-learn>=0.5.7",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
zoology = ["zoology", "causal-conv1d", "mamba-ssm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinylang"]

[tool.uv.sources]
pyvene = { git = "https://github.com/stanfordnlp/pyvene.git" }
zoology = { git = "https://github.com/aryamanarora/zoology.git" }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.scripts]
tinylang = "tinylang.main:main"

[tool.uv]
no-build-isolation-package = ["zoology", "causal-conv1d", "mamba-ssm"]
no-binary-package = ["mamba-ssm", "causal-conv1d"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true